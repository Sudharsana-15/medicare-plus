<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MediCare Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-img"></div>
      <div class="auth-form">
        <a href="index.html" class="navbar-brand"><i class="fas fa-heartbeat"></i> MediCare<span>+</span></a>
        <h2>Welcome Back</h2>
        <p>Sign in to access your health dashboard</p>
        <div class="social-login">
          <button class="btn-social"><i class="fab fa-google"></i> Google</button>
          <button class="btn-social"><i class="fab fa-facebook-f"></i> Facebook</button>
        </div>
        <div class="divider">or login with email</div>
        <form action="php/login.php" method="POST" id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" name="email" required>
            <span class="error-message"></span>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
            <span class="error-message"></span>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
        </form>
        <p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
        <p class="text-center"><a href="#">Forgot Password?</a></p>
      </div>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
