<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MediCare Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-img"></div>
      <div class="auth-form">
        <a href="index.html" class="navbar-brand"><i class="fas fa-heartbeat"></i> MediCare<span>+</span></a>
        <h2>Create Account</h2>
        <p>Join MediCare Plus for better healthcare</p>
        <form action="php/register.php" method="POST" id="registerForm">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="full_name" required>
          </div>
          <div class="d-flex" style="gap:15px">
            <div class="form-group" style="flex:1">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" name="phone" required>
            </div>
          </div>
          <div class="d-flex" style="gap:15px">
            <div class="form-group" style="flex:1">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="password" required>
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" name="confirm_password" required>
            </div>
          </div>
          <div class="d-flex" style="gap:15px">
            <div class="form-group" style="flex:1">
              <label class="form-label">Date of Birth</label>
              <input type="date" class="form-control" name="dob" required>
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label">Blood Group</label>
              <select class="form-control" name="blood_group">
                <option value="">Select</option>
                <option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <div class="d-flex" style="gap:20px">
              <div class="form-check"><input type="radio" class="form-check-input" name="gender" value="Male" required><label class="form-check-label">Male</label></div>
              <div class="form-check"><input type="radio" class="form-check-input" name="gender" value="Female"><label class="form-check-label">Female</label></div>
              <div class="form-check"><input type="radio" class="form-check-input" name="gender" value="Other"><label class="form-check-label">Other</label></div>
            </div>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" required>
            <label class="form-check-label">I agree to the Terms & Conditions</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
